name: Build

# Every push and pull request builds and tests on Windows and macOS.
# Pushing a tag such as v1.1 also publishes a GitHub release with the
# Windows installer, a Windows zip and a macOS (universal) zip.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Must match the version the local machine builds with (see CLAUDE.md).
  JUCE_TAG: "8.0.15"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Fetch JUCE
        shell: bash
        run: |
          git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          echo "JUCE_SDK_DIR=$RUNNER_TEMP/JUCE" >> "$GITHUB_ENV"

      # Same patch the developer machine gets from patches/apply_juce_patches.bat:
      # keeps the c-caron in the vendor name intact in the VST3 Unicode class info.
      - name: Patch JUCE
        shell: pwsh
        run: ./patches/juce_vst3_unicode_vendor.ps1 "$env:JUCE_SDK_DIR/modules/juce_audio_plugin_client/VST3/juce_VST3ModuleInfo.h"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Configure (macOS, universal)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Check moduleinfo vendor
        shell: bash
        run: |
          f=build/Azimuter_artefacts/Release/VST3/Azimuter.vst3/Contents/Resources/moduleinfo.json
          if [ -f "$f" ]; then
            python3 -c "import sys; raw=open(sys.argv[1],'rb').read(); raw.decode('utf-8'); n=raw.count(b'Kasperavi\xc4\x8dius'); print('vendor occurrences:', n); sys.exit(0 if n==3 else 1)" "$f"
          else
            echo "no moduleinfo.json"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Azimuter VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse build/Azimuter_artefacts/Release/VST3/Azimuter.vst3 package/
          Copy-Item readme.txt package/
          Compress-Archive -Path package/* -DestinationPath "Azimuter-$version-Windows.zip"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc Azimuter.iss
          Move-Item dist/*.exe .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          version=$(sed -n 's/^project(Azimuter VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p package
          cp -R build/Azimuter_artefacts/Release/VST3/Azimuter.vst3 package/
          # Ad-hoc signature so Apple Silicon will load the unsigned bundle.
          codesign --force --deep --sign - package/Azimuter.vst3
          lipo -info package/Azimuter.vst3/Contents/MacOS/Azimuter
          cp readme.txt package/
          (cd package && ditto -c -k --sequesterRsrc . "../Azimuter-$version-macOS.zip")

      - uses: actions/upload-artifact@v5
        with:
          name: azimuter-${{ matrix.name }}
          path: |
            Azimuter-*.zip
            Azimuter-*-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Azimuter ${GITHUB_REF_NAME#v}" \
            --prerelease \
            --notes "Windows: run the Setup .exe (or unzip the Windows zip into C:\\Program Files\\Common Files\\VST3). macOS: unzip and copy Azimuter.vst3 to ~/Library/Audio/Plug-Ins/VST3. The macOS build is unsigned; see readme.txt. Full manual: readme.txt."
